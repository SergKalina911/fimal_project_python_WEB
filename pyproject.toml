[tool.poetry]
name = "photoshare"
version = "0.1.0"
description = "PhotoShare REST API на FastAPI"
authors = ["Sergey <kalinasergey911@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.3"}
sqlalchemy = "^2.0.52"
psycopg2-binary = "^2.9.12"
python-jose = "^3.5.0"
qrcode = "^8.2"
alembic = "^1.13.2"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.0"   # <--- додано
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
# Для тестів
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"
httpx = "^0.27.0"
python-multipart = "^0.0.32"
asyncpg = "^0.31.0"
cloudinary = "^1.41.0"
bcrypt = "4.0.1"
pillow = "^12.3.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
